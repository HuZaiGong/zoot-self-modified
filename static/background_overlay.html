<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZOOT! 背景叠层 - DNA螺旋（模糊+透明+自转）</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent;
        }
        canvas {
            display: block;
            filter: blur(2px);
            opacity: 0.15;
            transition: filter 0.3s, opacity 0.3s;
        }
        .controls-panel, #info {
            display: none;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three-0.128.0.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ========== 固定参数 ==========
        const RADIUS = 1.1;
        const TURNS = 1.0;
        const HEIGHT = 16.0;
        const SEGMENTS = 250;
        const LINE_LEN = 0.115;

        const CAMERA_POS = new THREE.Vector3(1.69, 2.02, 10.42);
        const CAMERA_TARGET = new THREE.Vector3(2.38, 1.60, -0.70);
        const FLOW_SPEED = 0.0012;
        const ROTATION_SPEED = 0.002;   // 自转速度（极慢）

        // 日夜间模式检测
        function getCurrentTheme() {
            let isDark = true;
            try {
                const theme = localStorage.getItem('theme');
                if (theme === 'light') isDark = false;
                else if (theme === 'dark') isDark = true;
                else {
                    const parentDoc = window.parent.document;
                    if (parentDoc.documentElement.classList.contains('dark-mode')) isDark = true;
                    else if (parentDoc.documentElement.classList.contains('light-mode')) isDark = false;
                    else {
                        isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    }
                }
            } catch(e) {
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            return isDark ? 'dark' : 'light';
        }

        let currentTheme = getCurrentTheme();

        // 场景（透明背景）
        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(CAMERA_POS);
        camera.lookAt(CAMERA_TARGET);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);

        // 环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        // 全局自转角度
        let globalRotationAngle = 0;

        // 螺旋辅助函数
        function getPointAndRadial(t, phaseOffset) {
            const angle = (t * TURNS * Math.PI * 2) + phaseOffset;
            const x = RADIUS * Math.cos(angle);
            const z = RADIUS * Math.sin(angle);
            const y = t * HEIGHT;
            const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).normalize();
            return { pos: new THREE.Vector3(x, y, z), radial };
        }

        const rotX = -0.5;
        const rotZ = -0.4;
        const quatX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), rotX);
        const quatZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), rotZ);
        const finalQuat = quatX.clone().multiply(quatZ);
        const translate = new THREE.Vector3(-1.8, -3.5, 1.0);

        // 变换函数：先应用固定旋转和平移，再绕Y轴自转
        function transformPoint(p) {
            let result = p.clone().applyQuaternion(finalQuat).add(translate);
            // 绕Y轴旋转全局角度
            const cos = Math.cos(globalRotationAngle);
            const sin = Math.sin(globalRotationAngle);
            const x = result.x;
            const z = result.z;
            result.x = x * cos - z * sin;
            result.z = x * sin + z * cos;
            return result;
        }

        function createHelixChain(phaseOffset, colorHex) {
            const vertices = [];
            for (let i = 0; i <= SEGMENTS; i++) {
                const t = i / SEGMENTS;
                const { pos, radial } = getPointAndRadial(t, phaseOffset);
                const start = pos;
                const end = start.clone().add(radial.clone().multiplyScalar(LINE_LEN));
                const tStart = transformPoint(start);
                const tEnd = transformPoint(end);
                vertices.push(tStart.x, tStart.y, tStart.z);
                vertices.push(tEnd.x, tEnd.y, tEnd.z);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
            const material = new THREE.LineBasicMaterial({ color: colorHex });
            return new THREE.LineSegments(geometry, material);
        }

        let chain1, chain2;
        function rebuildSpiralColors() {
            const colorHex = (currentTheme === 'dark') ? 0xffffff : 0x000000;
            if (chain1) scene.remove(chain1);
            if (chain2) scene.remove(chain2);
            chain1 = createHelixChain(0, colorHex);
            chain2 = createHelixChain(Math.PI, colorHex);
            scene.add(chain1);
            scene.add(chain2);
        }

        // 动画流动
        let currentTOffset = 0;
        function updateHelixAnimation(deltaT) {
            if (!chain1 || !chain2) return;
            currentTOffset += deltaT;
            if (currentTOffset > 1) currentTOffset -= 1;
            const vertices1 = [], vertices2 = [];
            for (let i = 0; i <= SEGMENTS; i++) {
                let t = (i / SEGMENTS) + currentTOffset;
                if (t > 1) t -= 1;
                const { pos, radial } = getPointAndRadial(t, 0);
                const start = pos;
                const end = start.clone().add(radial.clone().multiplyScalar(LINE_LEN));
                const tStart = transformPoint(start);
                const tEnd = transformPoint(end);
                vertices1.push(tStart.x, tStart.y, tStart.z);
                vertices1.push(tEnd.x, tEnd.y, tEnd.z);

                const { pos: pos2, radial: radial2 } = getPointAndRadial(t, Math.PI);
                const start2 = pos2;
                const end2 = start2.clone().add(radial2.clone().multiplyScalar(LINE_LEN));
                const tStart2 = transformPoint(start2);
                const tEnd2 = transformPoint(end2);
                vertices2.push(tStart2.x, tStart2.y, tStart2.z);
                vertices2.push(tEnd2.x, tEnd2.y, tEnd2.z);
            }
            chain1.geometry.attributes.position.array = new Float32Array(vertices1);
            chain1.geometry.attributes.position.needsUpdate = true;
            chain2.geometry.attributes.position.array = new Float32Array(vertices2);
            chain2.geometry.attributes.position.needsUpdate = true;
        }

        let lastTime = performance.now();
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            // 自转角度累加
            globalRotationAngle += delta * ROTATION_SPEED;
            if (globalRotationAngle > Math.PI * 2) globalRotationAngle -= Math.PI * 2;
            // 更新流动动画
            updateHelixAnimation(delta * FLOW_SPEED);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // 主题监听
        function watchThemeChange() {
            try {
                const targetNode = window.parent.document.documentElement;
                const observer = new MutationObserver(() => {
                    const newTheme = getCurrentTheme();
                    if (newTheme !== currentTheme) {
                        currentTheme = newTheme;
                        rebuildSpiralColors();
                    }
                });
                observer.observe(targetNode, { attributes: true });
            } catch(e) {
                setInterval(() => {
                    const newTheme = getCurrentTheme();
                    if (newTheme !== currentTheme) {
                        currentTheme = newTheme;
                        rebuildSpiralColors();
                    }
                }, 1000);
            }
        }

        rebuildSpiralColors();
        watchThemeChange();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.updateBackgroundTheme = (isDark) => {
            currentTheme = isDark ? 'dark' : 'light';
            rebuildSpiralColors();
        };
    </script>
</body>
</html>
